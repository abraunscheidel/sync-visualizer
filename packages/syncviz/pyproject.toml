[project]
name = "syncviz"
version = "0.1.0"
description = "Core framework for exploring synchronized multi-source scientific data."
requires-python = ">=3.11"
dependencies = ["numpy>=1.26"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/syncviz"]
