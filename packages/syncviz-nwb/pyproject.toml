[project]
name = "syncviz-nwb"
version = "0.1.0"
description = "NWB source plugin for syncviz."
requires-python = ">=3.11"
dependencies = ["syncviz", "pynwb>=2.8"]

# The core never imports this package. It discovers NWBSource through this
# entry point when a project config declares `type: nwb`.
[project.entry-points."syncviz.sources"]
nwb = "syncviz_nwb:NWBSource"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/syncviz_nwb"]
