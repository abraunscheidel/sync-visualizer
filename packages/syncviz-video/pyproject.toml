[project]
name = "syncviz-video"
version = "0.1.0"
description = "Video source and video sync-signal detectors for syncviz."
requires-python = ">=3.11"
dependencies = ["syncviz", "av>=12"]

[project.entry-points."syncviz.sources"]
video = "syncviz_video:VideoSource"

[project.entry-points."syncviz.sync_detectors"]
dark_frames = "syncviz_video:DarkFrameDetector"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/syncviz_video"]
