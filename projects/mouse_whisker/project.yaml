# Mouse whisker object-localization recordings (DANDI 000231). Every session found below is
# available from the Session picker in the toolbar.
# Run with:  syncviz projects/mouse_whisker/project.yaml
#
# The schema is still evolving. This file records how the framework's generic concepts map onto
# this experiment. Some sessions have no neural recording (sub-219CR) and one has (sub-229CR);
# none store sync pulses. See docs/design.md section 18.1 for what the dataset contains.

root: ../..                      # relative paths below are resolved from the repository root
cache: data/derived/cache        # expensive derived results (frame index, brightness scans)

# `sources` is a template: {path}, {dir} and {stem} are filled in from each recording found below
# (here every .nwb file in the dataset). The video sits in a folder named after the NWB file; a
# recording without one simply has no video, and the video view says so.
sources:
  session:
    type: nwb                    # resolved via the syncviz.sources entry point
    path: "{path}"
  video:
    type: video
    path: "{dir}/{stem}/*.mkv"
    fps: 200                     # the container reports 30; use the dataset's rate
    sync_signal:
      kind: dark_frames          # blackout at each trial boundary

# Where the recordings are. The core calls each one a "collection"; the label is what this
# experiment calls it. Attributes are read from the path and can be filtered in the toolbar.
collections:
  label: Session
  from: {glob: "data/dandi/000231/sub-*/*.nwb"}
  attributes:
    mouse: 'sub-([^_/]+)_'
    date: 'ses-(\d{8})'
  title: "{mouse} · {date}"     # how the picker names a session; dates are shown as the display setting below
  attribute_types: {date: date}   # so the dropdown shows 2023-04-15, not 20230415
  attribute_labels:               # how the dropdowns name an attribute, singular and plural
    mouse: {label: Mouse, plural: mice}
    date: {label: Date, plural: dates}

# How dates and times are shown: iso (2023-04-15, the default), us, eu, long, short, or a strftime pattern such as "%d %b %Y".
display:
  date: iso
  datetime: iso

# The core only knows "segments" (intervals you can step through). The label is
# display text; "Trial" is this experiment's name for them.
segmentations:
  trials:
    label: Trial               # the name shown for each item; add `label_plural:` if "+s" is wrong
    from: session:intervals/trials
    number_attribute: trial      # shown as the segment's number
    filters: [stimulus, outcome, choice, servo_position]
  # Windows cut around events: 500 ms either side of the start of every touch, inside the trial it falls in. They take the
  # trial's attributes, and movement stays inside them. Choose between these and trials in the toolbar.
  touches_c0:
    label: "C0 touch"
    label_plural: "C0 touches"
    derive: {from: "session:processing/behavior/contacts_by_whisker_C0", edge: start, before_ms: 500, after_ms: 500, within: trials}
    filters: [stimulus, outcome, choice, servo_position]
  touches_c1:
    label: "C1 touch"
    label_plural: "C1 touches"
    derive: {from: "session:processing/behavior/contacts_by_whisker_C1", edge: start, before_ms: 500, after_ms: 500, within: trials}
    filters: [stimulus, outcome, choice, servo_position]
  touches_c2:
    label: "C2 touch"
    label_plural: "C2 touches"
    derive: {from: "session:processing/behavior/contacts_by_whisker_C2", edge: start, before_ms: 500, after_ms: 500, within: trials}
    filters: [stimulus, outcome, choice, servo_position]
  touches_c3:
    label: "C3 touch"
    label_plural: "C3 touches"
    derive: {from: "session:processing/behavior/contacts_by_whisker_C3", edge: start, before_ms: 500, after_ms: 500, within: trials}
    filters: [stimulus, outcome, choice, servo_position]

# Notes on how to read a field, shown as tooltips next to the description the data file itself gives. Keys are the names
# the interface shows. See docs/datasets/dandi-000231.md for the longer guide.
glossary:
  stimulus: "Which object shape was presented: concave or convex. The mouse reports it by licking left or right."
  outcome: "correct, error, or spoil. A spoiled trial (no usable choice) should be ignored in any analysis."
  choice: "Which spout the mouse licked: left, right, or nogo (no lick)."
  servo_position: "How far the object was from the face: close, medium or far. Farther means fewer whiskers can reach it."
  Lick left: "The tongue touched the left spout."
  Lick right: "The tongue touched the right spout."
  Reward left: "A drop of water was delivered at the left spout."
  Contact C0: "A touch of the object by whisker C0. Start and end are the dataset authors' definition, taken from the tracking."
  Contact C1: "A touch of the object by whisker C1. Start and end are the dataset authors' definition, taken from the tracking."
  Contact C2: "A touch of the object by whisker C2. Start and end are the dataset authors' definition, taken from the tracking."
  Contact C3: "A touch of the object by whisker C3. Start and end are the dataset authors' definition, taken from the tracking."
  Whiskers: "The four tracked whiskers, C0 to C3. Each is followed by eight points from the tip to the base."
  Contacts: "Touches of the object, as a badge for when each happens and a ring for where on the picture."
  Licks and rewards: "Tongue contacts with the spouts, and water deliveries."
  Contact point C0: "Where on the picture whisker C0 touched the object, averaged over the contact, so the ring does not move during it."
  Contact point C1: "Where on the picture whisker C1 touched the object, averaged over the contact, so the ring does not move during it."
  Contact point C2: "Where on the picture whisker C2 touched the object, averaged over the contact, so the ring does not move during it."
  Contact point C3: "Where on the picture whisker C3 touched the object, averaged over the contact, so the ring does not move during it."

# The events the Events panel can build conditions from ("keep the trials where any of these happened"), by scope. The panel
# starts empty; the viewer adds what they need and saves it in the workspace. Names here are the ones shown, and the glossary
# explains them. Not listed: "rewards right" is a copy of "licks right" in this dataset.
events:
  Contacts:
    Contact C0: {from: "session:processing/behavior/contacts_by_whisker_C0"}
    Contact C1: {from: "session:processing/behavior/contacts_by_whisker_C1"}
    Contact C2: {from: "session:processing/behavior/contacts_by_whisker_C2"}
    Contact C3: {from: "session:processing/behavior/contacts_by_whisker_C3"}
  Licks and rewards:
    Lick left: {from: "session:processing/behavior/licks", member: left}
    Lick right: {from: "session:processing/behavior/licks", member: right}
    Reward left: {from: "session:processing/behavior/rewards", member: left}

# What one step of the playhead (Shift+Left / Shift+Right) means. Optional: without this the
# toolbar starts on the first view that has a time grid, and the user can change it there.
# Either name a view:  step: {view: Whisker video}   or a fixed interval:  step: {interval_ms: 25}
step:
  view: Whisker video

# Panels in the views area. Which types exist depends on the installed plugins.
views:
  - type: video
    title: Whisker video
    source: video
    area: left
    # Event badges over the picture, in a corner (top-right, top-left, bottom-left, bottom-right, or off). Each badge lights
    # when its event happens at the frame on screen and fades. The viewer can change the corner and hide events from the
    # Views list; this is what it starts with.
    overlay:
      corner: top-right
      decay: 0.25
      rows:
        - {name: Lick left,  group: Licks and rewards, kind: events,    from: "session:processing/behavior/licks",   member: left}
        - {name: Lick right, group: Licks and rewards, kind: events,    from: "session:processing/behavior/licks",   member: right}
        - {name: Reward left, group: Licks and rewards, kind: events,   from: "session:processing/behavior/rewards", member: left}
        - {name: Contact C0, group: Contacts, kind: intervals, from: "session:processing/behavior/contacts_by_whisker_C0"}
        - {name: Contact C1, group: Contacts, kind: intervals, from: "session:processing/behavior/contacts_by_whisker_C1"}
      # `group:` on any item puts it under one switch in the Views list (a group can mix badges and drawings).
      # Drawn on the picture itself, in picture pixels. The tracked whiskers are lines from base to tip (the file stores them
      # with a unit conversion, which is undone to get pixels); a ring marks the tip while a contact lasts.
      # The eight tracked markers along each whisker (tip to base), drawn as a curve, as dots, or both; `skeleton_style` is the start.
      skeleton_style: curve
      skeletons:
        - {name: Whisker C0, group: Whiskers, from: "session:processing/behavior/raw_position_whisker_C0"}
        - {name: Whisker C1, group: Whiskers, from: "session:processing/behavior/raw_position_whisker_C1"}
        - {name: Whisker C2, group: Whiskers, from: "session:processing/behavior/raw_position_whisker_C2"}
        - {name: Whisker C3, group: Whiskers, from: "session:processing/behavior/raw_position_whisker_C3"}
      markers:
        - {name: Contact point C0, group: Contacts, from: "session:processing/behavior/contacts_by_whisker_C0", x: tip_x, y: tip_y, color_of: Whisker C0}
        - {name: Contact point C1, group: Contacts, from: "session:processing/behavior/contacts_by_whisker_C1", x: tip_x, y: tip_y, color_of: Whisker C1}
        - {name: Contact point C2, group: Contacts, from: "session:processing/behavior/contacts_by_whisker_C2", x: tip_x, y: tip_y, color_of: Whisker C2}
        - {name: Contact point C3, group: Contacts, from: "session:processing/behavior/contacts_by_whisker_C3", x: tip_x, y: tip_y, color_of: Whisker C3}
  - type: timeseries
    title: Whisker C0 angle
    series: {from: "session:processing/behavior/processed_position_whisker_C0", member: angle}
    window: 10

# Evidence about synchronization, shown by Tools > Sync diagnostics. Results are kept (the first scan of a long video
# takes minutes). "pass" means consistent with the clocks agreeing within the tolerance, not proof.
sync:
  tolerance_ms: 20
  checks:
    - name: Video blackouts vs trial starts
      type: paired_events
      test: video:sync_signal
      reference: {from: "session:intervals/trials", edge: start}
      note: >
        In this dataset the trial times appear to have been defined from these blackouts, so exact agreement is expected
        and is not independent evidence; it shows the two were built consistently.
    - name: Neural response to whisker contact
      type: event_response
      stimulus: {from: "session:processing/behavior/contacts_by_whisker_C1", edge: start}
      response: "session:units"
      expect_ms: [5, 30]
      note: >
        Independent of any sync signal: barrel-cortex neurons should fire about 10 to 20 ms after a whisker touches the
        object. Only recordings with neural data can run it.
