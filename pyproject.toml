# Workspace root. Not a published package — it just ties the packages under
# packages/ together so `uv sync` installs them all in editable mode.
[project]
name = "sync-visualizer-workspace"
version = "0.0.0"
requires-python = ">=3.11"
dependencies = ["syncviz", "syncviz-nwb", "syncviz-video"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
syncviz = { workspace = true }
syncviz-nwb = { workspace = true }
syncviz-video = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
