[project]
name = "syncviz-app"
version = "0.1.0"
description = "Qt desktop shell for syncviz: dockable views, playback controls, timeline."
requires-python = ">=3.11"
dependencies = ["syncviz", "PySide6>=6.6", "pyqtgraph>=0.13", "pyyaml>=6"]

[project.scripts]
syncviz = "syncviz_app.main:main"

# Generic views that need only core resources. Registered exactly like any
# third-party view; nothing in the shell treats them specially.
[project.entry-points."syncviz.views"]
timeseries = "syncviz_app.views.timeseries:TimeSeriesView"
tracks = "syncviz_app.views.tracks:TracksView"
indicators = "syncviz_app.views.indicators:IndicatorsView"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/syncviz_app"]
